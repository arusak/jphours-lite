<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">Low compact stool</title>
  <desc id="desc">A low, compact stool with shorter proportions.</desc>

  <defs>
    <linearGradient id="bg" x1="100" y1="60" x2="918" y2="966" gradientUnits="userSpaceOnUse">
      <stop stop-color="#140B0A"/>
      <stop offset=".52" stop-color="#32150F"/>
      <stop offset="1" stop-color="#2B111A"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="43%" r="54%">
      <stop offset="0" stop-color="#7C2A18" stop-opacity=".34"/>
      <stop offset=".68" stop-color="#4A1A14" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="seatTop" x1="290" y1="322" x2="740" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE7A8"/>
      <stop offset=".52" stop-color="#F6B64C"/>
      <stop offset="1" stop-color="#E87532"/>
    </linearGradient>

    <linearGradient id="seatFace" x1="292" y1="452" x2="732" y2="552" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E97D2F"/>
      <stop offset=".6" stop-color="#C4572E"/>
      <stop offset="1" stop-color="#7E2830"/>
    </linearGradient>

    <linearGradient id="legLeft" x1="330" y1="530" x2="438" y2="826" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8C565"/>
      <stop offset=".55" stop-color="#E99638"/>
      <stop offset="1" stop-color="#D56A31"/>
    </linearGradient>

    <linearGradient id="legRight" x1="592" y1="530" x2="698" y2="826" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3B656"/>
      <stop offset=".5" stop-color="#DE7C35"/>
      <stop offset="1" stop-color="#B84932"/>
    </linearGradient>

    <linearGradient id="bar" x1="410" y1="650" x2="620" y2="735" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3B652"/>
      <stop offset="1" stop-color="#D66A31"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="48%" r="72%">
      <stop offset=".58" stop-color="#000" stop-opacity="0"/>
      <stop offset=".84" stop-color="#060202" stop-opacity=".16"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <ellipse cx="512" cy="792" rx="260" ry="50" fill="#0D0504" opacity=".48"/>
  <g>
    <rect x="418" y="674" width="188" height="46" rx="14" fill="url(#bar)"/>
    <path d="M378 566 H456 L424 790 Q420 812 398 812 H362 Q340 812 344 792 Z" fill="url(#legLeft)"/>
    <path d="M568 566 H646 L680 792 Q684 812 662 812 H626 Q604 812 600 790 Z" fill="url(#legRight)"/>
    <path d="M280 448 H744 V492 Q744 524 712 524 H312 Q280 524 280 492 Z" fill="url(#seatFace)"/>
    <path d="M300 388 Q308 356 342 356 H682 Q716 356 724 388 L744 452 Q748 468 732 468 H292 Q276 468 280 452 Z" fill="url(#seatTop)"/>
    <rect x="340" y="370" width="350" height="16" rx="8" fill="#FFE8B5" opacity=".34"/>
  </g>
  <rect width="1024" height="1024" fill="url(#vignette)" pointer-events="none"/>
</svg>
