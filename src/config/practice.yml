tempo:
  default: 80
  min: 20
  max: 300
  increment: 1
exerciseDuration:
  default: 300
  min: 60
  max: 7200
  increment: 60
breakDuration:
  default: 120
  min: 60
  max: 1200
  increment: 60
quickRestDuration:
  default: 30
  min: 0
  max: 180
  increment: 5
warningLeadTime:
  default: 20
  min: 0
  max: 120
  increment: 5
metronome:
  defaultSound: classic
  sounds:
    classic: { waveform: sine, frequency: 1100, decay: 0.06 }
    wood: { waveform: triangle, frequency: 720, decay: 0.08 }
    digital: { waveform: square, frequency: 1400, decay: 0.035 }
audio:
  beatPeak: 0.35
  warningPeak: 0.22
  completionPeak: 0.28
interaction:
  slideToStopThreshold: 0.85
